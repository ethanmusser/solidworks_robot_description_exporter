name: Build SW2RD and (optionally) installer

# `build` runs on every supported trigger and compiles SW2RD.dll. `test`
# depends on `build` and runs the SolidWorks-independent xUnit subset (trait
# Category=SWFree) on every trigger. `installer` depends on `build`, downloads
# its artifact, and runs Inno Setup + checksum + attestation + upload. The
# installer job runs only when:
#   - trigger is `release` (cuts a tagged release with assets attached)
#   - trigger is `push` (every push to master, uploads a workflow artifact)
#   - trigger is `workflow_dispatch` (manual smoke test from the Actions tab)
#   - trigger is `pull_request` AND the PR has the `ci:installer` label

on:
  release:
    types: [created]
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to fold into the installer filename (workflow_dispatch only)"
        required: false
        default: "manual"
  pull_request:
    # `labeled` / `unlabeled` re-trigger the workflow when the `ci:installer`
    # label is added or removed without a fresh push.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'SW2RD/**'
      - 'INSTALL/**'
      - 'scripts/**'
      - 'SW2RD.sln'
      - '.github/workflows/release.yml'

# Collapse rapid pushes on the same ref into one build. Release events use a
# unique tag ref so they never share a group with anything else.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `id-token: write` + `attestations: write` are required by actions/attest@v4
# in the installer job. Scoped at workflow level for simplicity.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build SW2RD.dll
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout (with full history for git describe)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # scripts/UpdateVersionInfo.ps1 runs `git describe --tags` at MSBuild
      # BeforeBuild and embeds the result as AssemblyInformationalVersion.
      # Force-refresh tags so a release commit's tag is visible.
      - name: Fetch tags
        run: git fetch --tags --force

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # Target SW2RD.csproj directly (not SW2RD.sln) so we build just the add-in
      # DLL the installer ships, skipping the sibling TestRunner project (it is a
      # dev-box xUnit harness and is not part of the release artifact). The
      # SW-free test subset runs from the same SW2RD.dll in the `test` job below.
      # `msbuild /restore /t:Build` uses the NuGet client that ships with VS and
      # scopes restore to one project.
      #
      # /p:SolidWorksPath points SW2RD.csproj's HintPaths at the vendored
      # SOLIDWORKS DLLs under SW2RD/lib/sw-api/api/redist/.
      - name: Restore + Build SW2RD (Release, x64)
        run: msbuild SW2RD\SW2RD.csproj /restore /t:Build /p:Configuration=Release /p:Platform=x64 "/p:SolidWorksPath=$env:GITHUB_WORKSPACE\SW2RD\lib\sw-api" /verbosity:minimal /nologo

      # Upload the full bin/x64/Release/ tree (DLL, vendored NuGet refs,
      # images/, .config files) so the installer job can reconstruct it at the
      # path Install.iss reads from. A DLL-only artifact would silently produce
      # a broken installer.
      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: sw2rd-build-output
          path: SW2RD/bin/x64/Release/
          retention-days: 7
          if-no-files-found: error

  test:
    name: Run SW-free unit tests
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      # Check out the source into a `solidworks_urdf_exporter` subdirectory. The
      # golden-fixture tests (TestExportGoldens) locate test-fixtures/golden by
      # walking up from the running DLL for an ancestor directory NAMED
      # `solidworks_urdf_exporter`, then reading
      # <ancestor>/solidworks_urdf_exporter/test-fixtures/golden. Checking out
      # under that path reproduces the dev-box layout the heuristic expects.
      - name: Checkout (for golden test fixtures)
        uses: actions/checkout@v5
        with:
          path: solidworks_urdf_exporter

      # Reuse the Release SW2RD.dll from `build`, placed inside the checked-out
      # tree so the relative layout above holds. The Test/ sources compile into
      # the DLL in every config, and EmbedInteropTypes means the assembly loads
      # (and tests are DISCOVERED) without a SolidWorks install. Only EXECUTING a
      # test that touches the SldWorks.Application COM ProgID needs SolidWorks,
      # and the -trait filter below excludes every such test before its class is
      # constructed.
      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: sw2rd-build-output
          path: solidworks_urdf_exporter/SW2RD/bin/x64/Release/

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Fetch xUnit console runner
        run: nuget install xunit.runner.console -Version 2.4.1 -OutputDirectory tools -ExcludeVersion

      # Run only the SolidWorks-independent subset (writers, config round-trip,
      # golden fixtures, validation). xunit.console.exe exits non-zero on any
      # failure, failing the job - so this is safe as a required check.
      - name: Run SW-free tests
        run: tools\xunit.runner.console\tools\net452\xunit.console.exe solidworks_urdf_exporter\SW2RD\bin\x64\Release\SW2RD.dll -trait "Category=SWFree" -nocolor

  installer:
    name: Build installer
    needs: build
    if: |
      github.event_name == 'release' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:installer'))
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      # Shallow checkout: only Install.iss and the trigger event payload are
      # needed here; no `git describe` runs in this job.
      - name: Checkout
        uses: actions/checkout@v5

      # Land at the relative path Install.iss reads from
      # (SourceDir=..\SW2RD\bin\, Source: x64\Release\* recursive).
      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: sw2rd-build-output
          path: SW2RD/bin/x64/Release/

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # AssemblyVersion is pinned at 0.1.0.0 (see AssemblyInfo.cs), so the
      # .iss-default OutputBaseFilename (computed from GetFileVersion) would
      # collide across releases. Derive a unique suffix from the trigger
      # payload instead.
      - name: Compute installer filename
        id: filename
        run: |
          $evt = $env:GITHUB_EVENT_NAME
          if ($evt -eq 'release') {
            $tag = '${{ github.event.release.tag_name }}'
          } elseif ($evt -eq 'push') {
            $sha = '${{ github.sha }}'
            $shortSha = if ($sha.Length -ge 7) { $sha.Substring(0,7) } else { $sha }
            $tag = "master-$shortSha"
          } elseif ($evt -eq 'pull_request') {
            $sha = '${{ github.event.pull_request.head.sha }}'
            $shortSha = if ($sha.Length -ge 7) { $sha.Substring(0,7) } else { $sha }
            $tag = "pr${{ github.event.pull_request.number }}-$shortSha"
          } else {
            $tag = '${{ github.event.inputs.tag_name }}'
          }
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = 'manual' }
          $safe = ($tag -replace '[^A-Za-z0-9._-]', '_')
          $name = "sw2rdSetup_$safe"
          Write-Host "Installer base filename: $name"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$name"

      - name: Build installer
        run: iscc /DBuildConfig=Release "/DOutputBaseFilename=${{ steps.filename.outputs.name }}" INSTALL\Install.iss

      - name: List built installer
        run: Get-ChildItem INSTALL\OUTPUT

      # Output format is GNU coreutils binary mode ("<sha> *<filename>") so
      # `sha256sum -c` works unmodified on the receiving side. See README
      # "Verifying downloads".
      - name: Compute SHA-256 checksum
        run: |
          $exe = "INSTALL\OUTPUT\${{ steps.filename.outputs.name }}.exe"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $line = "$sha *${{ steps.filename.outputs.name }}.exe"
          Set-Content -Path "$exe.sha256" -Value $line -NoNewline
          Write-Host "Checksum: $line"

      # Mint a Sigstore-backed build provenance attestation. Users verify with:
      #
      #   gh attestation verify sw2rdSetup_<tag>.exe -R <owner>/<repo>
      #
      # actions/attest@v4 emits SLSA provenance by default when no custom
      # predicate is supplied.
      #
      # Skipped on pull_request because (1) fork PRs lack OIDC permissions to
      # mint attestations and would fail noisily, and (2) PR-built installers
      # are iteration artifacts that shouldn't appear in the transparency log.
      - name: Generate build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: INSTALL/OUTPUT/${{ steps.filename.outputs.name }}.exe

      - name: Upload installer + checksum as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.filename.outputs.name }}
          path: |
            INSTALL/OUTPUT/${{ steps.filename.outputs.name }}.exe
            INSTALL/OUTPUT/${{ steps.filename.outputs.name }}.exe.sha256
          if-no-files-found: error

      - name: Attach installer + checksum to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            "INSTALL\OUTPUT\${{ steps.filename.outputs.name }}.exe" `
            "INSTALL\OUTPUT\${{ steps.filename.outputs.name }}.exe.sha256" `
            --clobber
