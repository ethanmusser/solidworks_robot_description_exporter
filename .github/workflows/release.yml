name: Build installer and attach to release

# Fires whenever a Release is created in the GitHub UI (the user picks/creates
# the tag, writes release notes, and clicks "Publish release"). The workflow:
#   1. Builds SW2URDF.dll in Release configuration against the SOLIDWORKS API
#      DLLs vendored under SW2URDF/lib/sw-api/.
#   2. Compiles the Inno Setup installer (sw2urdfSetup_<tag>.exe).
#   3. Computes a SHA-256 checksum file (sw2urdfSetup_<tag>.exe.sha256)
#      alongside the installer.
#   4. Generates a Sigstore-backed build provenance attestation for the
#      installer via actions/attest@v4. Users verify the download with
#      `gh attestation verify <file> -R <owner>/<repo>`.
#   5. Attaches the .exe and .sha256 to the triggering release.
#
# Also exposes a workflow_dispatch entry so the pipeline can be smoke-tested
# from the Actions tab without cutting a real release; in that mode the
# installer + checksum are only uploaded as workflow artifacts, not attached
# to a release (and the attestation is still minted so the verify flow can be
# exercised end-to-end). PR runs build and upload artifacts but do NOT mint
# attestations because forks don't have the required OIDC permissions.

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to fold into the installer filename (workflow_dispatch only)"
        required: false
        default: "manual"
  pull_request:
    paths:
      - 'SW2URDF/**'
      - 'INSTALL/**'
      - 'scripts/**'
      - 'SW2URDF.sln'
      - '.github/workflows/release.yml'

permissions:
  contents: write
  # id-token + attestations are required for actions/attest@v4 to mint a
  # Sigstore-backed build provenance attestation against the installer.
  # See "GitHub Artifact Attestations" in AGENTS.md.
  id-token: write
  attestations: write

jobs:
  build-installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout (with full history for git describe)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # actions/checkout fetches tags as part of fetch-depth: 0, but force-refresh
      # to be defensive: scripts/UpdateVersionInfo.ps1 runs `git describe --tags`
      # at MSBuild BeforeBuild and embeds the result as
      # [assembly: AssemblyInformationalVersion(...)]. Without the tag pointing
      # at the release commit, the embedded version would fall back to a bare
      # short SHA.
      - name: Fetch tags
        run: git fetch --tags --force

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # Restore + build SW2URDF.csproj in a single MSBuild invocation. We
      # deliberately do NOT use the standalone `nuget.exe restore` against the
      # solution: NuGet 7.x has surfaced a "MsBuild timeout out while trying
      # to get project to project references" failure when restoring this
      # solution, and a sln-level restore also pulls in the sibling
      # TestRunner project (which references solidworkstools.dll via
      # $(SolidWorksPath), unsatisfiable on GitHub-hosted runners). SW2URDF
      # is an SDK-style project, so `msbuild /restore /t:Build` uses the
      # NuGet client that ships inside Visual Studio and scopes the work
      # to exactly the project we ship.
      #
      # /p:SolidWorksPath redirects the HintPaths in SW2URDF.csproj to the
      # vendored SOLIDWORKS DLLs under SW2URDF/lib/sw-api/api/redist/.
      - name: Restore + Build SW2URDF (Release, x64)
        run: msbuild SW2URDF\SW2URDF.csproj /restore /t:Build /p:Configuration=Release /p:Platform=x64 "/p:SolidWorksPath=$env:GITHUB_WORKSPACE\SW2URDF\lib\sw-api" /verbosity:minimal /nologo

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # Compute the installer filename suffix from the release tag (or the
      # workflow_dispatch input). AssemblyVersion in the DLL is deliberately
      # pinned (see AssemblyInfo.cs) so the .iss-default OutputBaseFilename
      # (derived from the DLL's FileVersion) would collide across releases.
      # Override explicitly with the release tag instead.
      - name: Compute installer filename
        id: filename
        run: |
          $evt = $env:GITHUB_EVENT_NAME
          if ($evt -eq 'release') {
            $tag = '${{ github.event.release.tag_name }}'
          } elseif ($evt -eq 'pull_request') {
            $sha = '${{ github.event.pull_request.head.sha }}'
            $shortSha = if ($sha.Length -ge 7) { $sha.Substring(0,7) } else { $sha }
            $tag = "pr${{ github.event.pull_request.number }}-$shortSha"
          } else {
            $tag = '${{ github.event.inputs.tag_name }}'
          }
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = 'manual' }
          $safe = ($tag -replace '[^A-Za-z0-9._-]', '_')
          $name = "sw2urdfSetup_$safe"
          Write-Host "Installer base filename: $name"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$name"

      - name: Build installer
        run: iscc /DBuildConfig=Release "/DOutputBaseFilename=${{ steps.filename.outputs.name }}" INSTALL\Install.iss

      - name: List built installer
        run: Get-ChildItem INSTALL\OUTPUT

      # SHA-256 checksum is published alongside the installer as a release
      # asset so users without the gh CLI can still verify the download via
      # Get-FileHash / sha256sum -c. The "<sha> *<filename>" output format is
      # GNU coreutils' "binary mode" convention so `sha256sum -c` works
      # unmodified on the receiving side. See README "Verifying downloads".
      - name: Compute SHA-256 checksum
        run: |
          $exe = "INSTALL\OUTPUT\${{ steps.filename.outputs.name }}.exe"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $line = "$sha *${{ steps.filename.outputs.name }}.exe"
          Set-Content -Path "$exe.sha256" -Value $line -NoNewline
          Write-Host "Checksum: $line"

      # Generate a Sigstore-backed build provenance attestation tying the
      # built installer to this workflow run, the source commit, and the
      # repository identity. Verified by users with:
      #
      #   gh attestation verify sw2urdfSetup_<tag>.exe -R <owner>/<repo>
      #
      # Skipped on pull_request runs because PR-built installers are not
      # shipped (and forks don't have the OIDC permissions to mint
      # attestations anyway). Predicate type is pinned to SLSA v1 explicitly
      # because `gh attestation verify` defaults to it and a future change
      # would silently break verification of already-published installers.
      #
      # actions/attest@v4 is the current canonical action; the older
      # actions/attest-build-provenance is a deprecated wrapper around it
      # as of its v4.1.0 release (Feb 2026).
      - name: Generate build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: INSTALL/OUTPUT/${{ steps.filename.outputs.name }}.exe
          predicate-type: https://slsa.dev/provenance/v1

      - name: Upload installer + checksum as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.filename.outputs.name }}
          path: |
            INSTALL/OUTPUT/${{ steps.filename.outputs.name }}.exe
            INSTALL/OUTPUT/${{ steps.filename.outputs.name }}.exe.sha256
          if-no-files-found: error

      - name: Attach installer + checksum to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            "INSTALL\OUTPUT\${{ steps.filename.outputs.name }}.exe" `
            "INSTALL\OUTPUT\${{ steps.filename.outputs.name }}.exe.sha256" `
            --clobber
